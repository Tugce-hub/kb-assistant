# Create the app at https://api.slack.com/apps -> "From an app manifest".
display_information:
  name: KB Assistant
  description: Answers engineering questions from our GitHub docs and code, with sources.
features:
  bot_user:
    display_name: kb
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
